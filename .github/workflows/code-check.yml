name: code-check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: |
          python -m compileall -q \
            stage_1 stage_2 stage_3 stage_4 \
            experiments paper_support Framework_draw scripts
      - name: Reject accidentally committed data and checkpoints
        shell: bash
        run: |
          if find . -type f \( \
            -name '*.pt' -o -name '*.pth' -o -name '*.ckpt' -o \
            -name '*.npy' -o -name '*.npz' -o -name '*.nc' -o \
            -name '*.h5' -o -name '*.hdf5' -o -name '*.tif' -o \
            -name '*.tiff' -o -name '*.xlsx' \
          \) -print -quit | grep -q .; then
            echo "Generated data or checkpoint artifact detected."
            exit 1
          fi

